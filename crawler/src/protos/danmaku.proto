syntax = "proto3";

package bilibili.danmaku;

message DmSegMobileReply {
    repeated DanmakuElem elems = 1;
}

message DanmakuElem {
    int64 id = 1;
    int32 progress = 2;
    int32 mode = 3;
    int32 fontsize = 4;
    uint64 color = 5;
    string mid_hash = 6;
    string content = 7;
    int64 ctime = 8;
}
